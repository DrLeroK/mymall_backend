# ==============================================================================
# Docker Compose for MyMall Multi-Tenant SaaS E-Commerce Backend
# ==============================================================================

services:
  # ============================================================================
  # MyMall Express Backend (REST API, WebSockets, Socket.io)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mymall_backend_app
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mymall_db}?schema=public
      - PORT=${PORT:-5001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mymall_network

  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mymall_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mymall_db}
    ports:
      - "${DOCKER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mymall_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mymall_network

  # ============================================================================
  # Mailpit - Email & SMTP Testing Server (Zero Auth in Dev)
  # Web UI: http://localhost:8025 | SMTP Port: localhost:1025
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: mymall_backend_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP port
    networks:
      - mymall_network

# ==============================================================================
# Persistent Volumes & Network Definitions
# ==============================================================================
volumes:
  postgres_data:
    name: mymall_postgres_data

networks:
  mymall_network:
    name: mymall_network
    driver: bridge

# ==============================================================================
# Docker Compose for MyMall Multi-Tenant E-Commerce Backend Platform
# ==============================================================================

services:
  # ============================================================================
  # MyMall Express Backend Application (REST APIs, Socket.io, Cron Workers)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mymall_backend_app
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mymall_db}?schema=public
      - PORT=${PORT:-5001}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - mymall_network

  # ============================================================================
  # PostgreSQL Database (Multi-Tenant Store, Inventory, Orders, Subscriptions)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mymall_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mymall_db}
    ports:
      - "${DOCKER_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mymall_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mymall_network

# ==============================================================================
# Persistent Volumes & Network Definitions
# ==============================================================================
volumes:
  postgres_data:
    name: mymall_postgres_data
  uploads_data:
    name: mymall_uploads_data

networks:
  mymall_network:
    name: mymall_network
    driver: bridge

name: MyMall Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: TypeScript Build & Static Analysis
  # ----------------------------------------------------------------------------
  typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript Project
        run: npm run build

  # ----------------------------------------------------------------------------
  # Stage 2: Database & Test Suites (Unit, Integration, E2E)
  # ----------------------------------------------------------------------------
  test:
    name: Database & Test Suite
    needs: [typecheck]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mymall_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mymall_test_db?schema=public
      JWT_SECRET: test_jwt_secret_min_32_characters_long_for_ci
      JWT_REFRESH_SECRET: test_refresh_jwt_secret_min_32_characters_for_ci
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Wait for PostgreSQL Service
        run: |
          node -e "
          const net = require('net');
          let retries = 30;
          function check() {
            if (retries <= 0) {
              console.error('❌ Failed to connect to PostgreSQL service within timeout.');
              process.exit(1);
            }
            const s = net.createConnection({ host: 'localhost', port: 5432 }, () => {
              s.end();
              console.log('✅ PostgreSQL service is connected and ready!');
              process.exit(0);
            });
            s.on('error', () => {
              retries--;
              setTimeout(check, 1000);
            });
          }
          check();
          "

      - name: Push Database Schema
        run: npx prisma db push --skip-generate

      - name: Run Test Suite (Unit, Integration & E2E)
        run: npm test

  # ----------------------------------------------------------------------------
  # Stage 3: Container Build Validation
  # ----------------------------------------------------------------------------
  docker-check:
    name: Container Build Validation
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t mymall-backend:${{ github.sha }} .

  # ----------------------------------------------------------------------------
  # Stage 4: Trigger Render Deploy Hook (Automatic CD)
  # Configure RENDER_DEPLOY_HOOK_URL in GitHub: Settings > Secrets and variables > Actions
  # ----------------------------------------------------------------------------
  render-deploy:
    name: Trigger Render Deploy Hook
    needs: [test, docker-check]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check Deploy Hook Secret
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets."
          echo "⏩ Skipping automatic deploy hook trigger. To enable CD, copy your Render Deploy Hook URL to GitHub: Settings > Secrets and variables > Actions > New repository secret."

      - name: Trigger Render Deployment via Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "🚀 Triggering Render deployment via deploy hook..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "✅ Render deployment successfully triggered!"
